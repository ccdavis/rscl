[package]
name = "rscl"
description = "rscl: a Clojure variant in Rust with a Cranelift JIT and AOT compiler"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
default-run = "rscl"

[lib]
name = "rscl"
path = "src/lib.rs"

[[bin]]
name = "rscl"
path = "src/main.rs"

[dependencies]
rscl-runtime = { path = "../rscl-runtime", default-features = false }
cranelift-codegen = { workspace = true }
cranelift-frontend = { workspace = true }
cranelift-module = { workspace = true }
cranelift-jit = { workspace = true }
cranelift-object = { workspace = true }
cranelift-native = { workspace = true }
rustyline = { workspace = true }
libloading = { workspace = true }

[dev-dependencies]
# Built for its cdylib: the bridge tests load target/<profile>/librscl_demo.so.
rscl-demo = { path = "../../examples/native-demo" }

[features]
default = ["mimalloc"]
# Forwarded to the runtime (see its Cargo.toml); `--no-default-features` for valgrind.
mimalloc = ["rscl-runtime/mimalloc"]
