[package]
name = "rscl-runtime"
description = "Runtime library for rscl: values, reader, printer, namespaces, core builtins"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
# rlib for the compiler/REPL host, staticlib for linking into AOT-built executables.
crate-type = ["rlib", "staticlib"]

[dependencies]
imbl = { workspace = true }
mimalloc = { version = "0.1", default-features = false, optional = true }
num-bigint = "0.4"
num-integer = "0.1"
num-traits = "0.2"
regex = "1"
rscl-abi = { path = "../rscl-abi" }

[features]
default = ["mimalloc"]
# Global allocator; off for valgrind runs, which cannot see mimalloc's heap.
mimalloc = ["dep:mimalloc"]
# Count live heap objects (used by tests to catch leaks without valgrind).
live-count = []
