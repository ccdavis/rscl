[package]
name = "rscl-demo"
description = "Example rscl bridge library: Rust functions callable from rscl via load-native"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
# cdylib for `load-native`; rlib so the rscl test suite can depend on (and so build) it.
crate-type = ["cdylib", "rlib"]

[dependencies]
rscl-bridge = { path = "../../crates/rscl-bridge" }
